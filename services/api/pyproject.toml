[project]
name = "medicare-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
 "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
 "python-multipart>=0.0.22,<1", "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23.1,<26",
 "httpx>=0.28,<1", "redis>=5.2,<7", "celery>=5.4,<6", "cryptography>=44,<47",
 "pymupdf>=1.26,<2", "Pillow>=11,<13", "pytesseract>=0.3.13,<1",
 "pydicom>=3,<4", "numpy>=2,<3", "opencv-python-headless>=4.11,<5", "email-validator>=2,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.15,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
