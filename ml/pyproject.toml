[project]
name = "medicare-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.6,<3", "monai>=1.5,<2", "transformers>=4.51,<5", "numpy>=2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "wfdb>=4.2,<5", "pillow>=11,<13", "pydicom>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.22,<1", "pytest>=8,<10"]
[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
