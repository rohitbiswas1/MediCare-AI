# Synthetic-data demo. Review Render's current charges before approving deployment.
# One instance owns the encrypted disk; web, API, worker, and scheduler run together.
services:
  - type: web
    name: medicare-ai-demo
    runtime: docker
    region: oregon
    plan: standard
    numInstances: 1
    dockerfilePath: ./infrastructure/docker/render-demo.Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false
    disk:
      name: medicare-demo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_MODE
        value: demo
      - key: APP_SECRET
        generateValue: true
      - key: LOCAL_DATA_DIR
        value: /var/data/medicare
      - key: AUTH_PROVIDER
        value: local
      - key: STORAGE_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: medicare-demo-queue
          type: keyvalue
          property: connectionString
      - key: RETENTION_DAYS
        value: "1"
  - type: keyvalue
    name: medicare-demo-queue
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: medicare-demo-db
    region: oregon
    plan: basic-256mb
    databaseName: medicare_demo
    user: medicare_demo
    ipAllowList: []
